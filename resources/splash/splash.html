<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>Shale · 页岩</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #253034;
        color: #f1ede4;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 38%, #34433f 0%, #253034 58%),
          #253034;
        user-select: none;
      }

      main {
        display: grid;
        justify-items: center;
        width: min(82vw, 340px);
        text-align: center;
      }

      svg {
        display: block;
        width: min(52vw, 190px);
        height: auto;
        margin-bottom: 26px;
      }

      h1 {
        margin: 0;
        font-size: clamp(25px, 7vw, 31px);
        font-weight: 620;
        letter-spacing: 0.04em;
      }

      p {
        margin: 11px 0 0;
        color: #c1beb6;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(13px, 3.6vw, 16px);
        font-style: italic;
        letter-spacing: 0.035em;
      }
    </style>
  </head>
  <body>
    <main aria-label="Shale 正在启动">
      <svg
        viewBox="0 0 320 128"
        role="img"
        aria-label="Shale 页岩层叠书页标志"
      >

        <path fill="#A7AAA6" d="M11 55c37 3 71 7 103 14 22 5 37 12 45 23l-3 7c-15-11-34-16-58-20-29-5-59-7-88-9z"/>
        <path fill="#A7AAA6" d="M164 91c18-13 43-21 73-25 26-4 51-5 77-4l-3 18c-28-1-54 0-78 3-27 4-50 9-68 16z"/>
        <path fill="#5F7D72" d="M8 77c35 1 70 4 103 9 22 3 38 9 48 17l-5 8c-17-8-38-11-62-13-30-3-59-3-87-4z"/>
        <path fill="#D3D0C8" d="M165 100c18-8 42-12 71-13 27-1 52 1 77 5l-3 17c-28-4-54-5-78-3-26 1-49 4-66 9z"/>

      </svg>
      <h1>Shale · 页岩</h1>
      <p>Let ideas settle into layers.</p>
    </main>
  </body>
</html>
